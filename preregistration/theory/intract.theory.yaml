formal_model:
  type: "sem"
  spec_ref: "design_analysis/tier1_developmental.json"

provenance:
  - step: "1"
    action: "tf_add_construct"
    detail: "Registered eleven constructs spanning text properties, reader capacities, the reading context and three outcomes, separating the effort a text costs from the difficulty a child reports and from the model a child ends with."
  - step: "2"
    action: "tf_add_proposition"
    detail: "Linked them into an acyclic graph with three text-to-effort paths, one reader path through decoding automaticity, three moderation claims and a parallel set of paths to the situation model."
  - step: "3"
    action: "tf_add_alternative"
    detail: "Registered four rival accounts: audio pacing, engagement, platform assignment and reverse causation from skill to practice."
  - step: "4"
    action: "tf_add_prediction"
    detail: "Derived ten interval predictions, six of them diagnostic against a registered alternative, and two of them outcome-neutral controls."
  - step: "5"
    action: "tf_add_alternative"
    detail: "Added two further rivals after an adversarial reading of the developmental literature: a bottleneck-release account opposing the capacity account behind p6, and a cue-utilisation account opposing the knowledge account behind p7. The two age-band predictions were rewritten as two-sided adjudicating tests, because on a proportional scale the direct evidence supports neither sign."
  - step: "6"
    action: "tf_add_assumption"
    detail: "Recorded six core auxiliary assumptions, five of which correspond to questions put to the data controller on 7 August 2026 and are resolved in the manuscript's data-provenance table."
  - step: "7"
    action: "tf_add_construct"
    detail: "Added four constructs. The first is the step by which every non-English text was machine-translated from its English source, as the data controller confirmed in October 2026. The others are the quality of each translation, story content set at generation and the division of a text into pages."
  - step: "8"
    action: "tf_add_proposition"
    detail: "Linked the four new constructs to text provenance, the three text constructs, processing effort and one another in fifteen causal propositions, so that the adjustment set follows from the graph by the disjunctive-cause criterion. Story content and translation quality are common causes of the text constructs and of effort, and the layout is a descendant of grammatical load, which is why it enters only a sensitivity analysis."
  - step: "9"
    action: "tf_amend"
    detail: "Widened the scope to texts of 200 to 600 words, so that it covers the longer versions served at the oldest reading level. Brought the measures into line with the feature specification. Surprisal is boundary-corrected, diversity is taken over content lemmas, noun-phrase elaboration replaces modification depth, connectives are counted against induced inventories and the five-sentence floor is counted on the English source. Replaced the attachment-accuracy condition with the registered reliability floor, and recorded in p7 and pred_h3_coherence_by_age the decomposition that attributes the Hypothesis 3 verdict."
