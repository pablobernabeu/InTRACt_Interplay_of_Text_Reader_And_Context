formal_model:
  type: "sem"
  spec_ref: "design_analysis/intract_processing_model.json"

provenance:
  - step: "1"
    action: "tf_add_construct"
    detail: "Registered eleven constructs spanning text properties, reader capacities, the reading context and three outcomes, separating the effort a text costs from the difficulty a child reports and from the model a child ends with."
  - step: "2"
    action: "tf_add_proposition"
    detail: "Linked them into an acyclic graph with three text-to-effort paths, one reader path through decoding automaticity, three moderation claims and a parallel set of paths to the situation model."
  - step: "3"
    action: "tf_add_alternative"
    detail: "Registered four rival accounts: audio pacing, engagement, platform assignment and reverse causation from skill to practice."
  - step: "4"
    action: "tf_add_prediction"
    detail: "Derived ten interval predictions, six of them diagnostic against a registered alternative, and two of them outcome-neutral controls."
  - step: "5"
    action: "tf_add_alternative"
    detail: "Added two further rivals after an adversarial reading of the developmental literature: an experience account opposing the capacity account behind p6, and a cue-utilisation account opposing the knowledge account behind p7. The two age-band predictions were rewritten as two-sided adjudicating tests, because on a proportional scale the direct evidence supports neither sign."
  - step: "6"
    action: "tf_add_assumption"
    detail: "Recorded six core auxiliary assumptions, five of which correspond to questions put to the data controller on 7 August 2026 and are resolved in the manuscript's data-provenance table."
